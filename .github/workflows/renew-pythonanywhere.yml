name: Renew PythonAnywhere

on:
  schedule:
    - cron: "0 4 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Renew PythonAnywhere web app
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
        run: python renew_pythonanywhere.py

      - name: Keep scheduled workflow active
        if: always()
        continue-on-error: true
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > .github/last-renewal-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-renewal-run.txt
          git diff --cached --quiet || git commit -m "chore: record PythonAnywhere renewal run"
          git push
